<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한량이 만든 한국투자증권 RSI Monitor ver 0.1</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #1b1f24; --muted: #6b7380;
    --up: #d6453d; --down: #2f6fdf; --pos: #1f9d55; --neg: #d6453d;
    --hot: #d6453d; --cold: #2f6fdf; --sel: #eef3ff; --input: #ffffff;
    --fs: 10px;   /* 글자 크기. 「가-」「가+」로 바꾼다 */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --line: #262c35; --text: #e6e9ee; --muted: #8b94a3;
      --up: #f0605a; --down: #5b8ff0; --pos: #3cc47c; --neg: #f0605a;
      --hot: #f0605a; --cold: #5b8ff0; --sel: #1d2633; --input: #0f1216;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: var(--fs)/1.4 "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
  h1 { font-size: calc(var(--fs) * 1.2); margin: 0; font-weight: 700; }
  h1 .by { font-size: calc(var(--fs) * 0.9); font-weight: 400; color: var(--muted); }
  .sub { color: var(--muted); font-size: var(--fs); }
  .pill { font-size: var(--fs); padding: 2px 8px; border-radius: 99px;
          background: var(--panel); border: 1px solid var(--line); color: var(--muted);
          max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill.ok { color: var(--pos); border-color: var(--pos); }
  .pill.bad { color: var(--neg); border-color: var(--neg); }
  main { padding: 0 12px 16px; display: grid; gap: 10px; }
  #markets { display: flex; gap: 16px; padding: 0 12px 8px; overflow-x: auto; white-space: nowrap;
             font-variant-numeric: tabular-nums; scrollbar-width: none; }
  #markets::-webkit-scrollbar { display: none; }
  #markets span.m { display: inline-flex; gap: 5px; align-items: baseline; }
  #markets .n { color: var(--muted); }
  #markets .v { font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .scroll { overflow-x: auto; }
  form.add { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  form.add input { font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--line);
                   border-radius: 5px; padding: 3px 6px; width: calc(var(--fs) * 15); }
  form.add button { font: inherit; border: 1px solid var(--line); background: var(--sel); color: var(--text);
                    border-radius: 5px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
  form.add button:disabled { opacity: .5; cursor: default; }
  #msg { color: var(--muted); } #msg.err { color: var(--neg); }
  form.add button#colbtn { margin-left: auto; background: var(--panel); }
  .menu { position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 6px 4px; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: grid; min-width: 110px; }
  .menu[hidden] { display: none; }
  .menu label { display: flex; gap: 6px; align-items: center; padding: 3px 8px; border-radius: 4px; cursor: pointer; }
  .menu label:hover { background: var(--sel); }
  .menu input { margin: 0; }
  .menu .mrow { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 3px 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 8px; text-align: right; white-space: nowrap; }
  th { font-size: var(--fs); color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child, th:nth-child(2), td.sym { text-align: left; }
  tbody tr { border-bottom: 1px solid var(--line); cursor: pointer; }
  tbody tr:last-child { border-bottom: 0; }
  tbody tr:hover { background: var(--sel); }
  tbody tr.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--down); }
  td.sym { font-weight: 700; width: calc(var(--fs) * 7.4); max-width: calc(var(--fs) * 7.4); overflow: hidden; text-overflow: ellipsis; }
  td.grip { width: 1%; padding: 0 0 0 4px; color: var(--muted); cursor: grab; touch-action: none;
            user-select: none; }
  td.grip span { visibility: hidden; display: inline-flex; padding: 2px 1px; }
  tbody tr:hover td.grip span, tbody tr.sel td.grip span, tbody tr.dragging td.grip span { visibility: visible; }
  tbody tr.dragging { background: var(--sel); opacity: .7; }
  tbody.sorting, tbody.sorting td.grip { cursor: grabbing; }
  td.del { width: 1%; padding: 0 4px; }
  td.del button { font: inherit; border: 0; background: none; color: var(--muted); cursor: pointer;
                  padding: 2px 5px; border-radius: 4px; visibility: hidden; display: inline-flex; }
  tbody tr:hover td.del button, tbody tr.sel td.del button { visibility: visible; }
  td.del button:hover { color: var(--neg); background: var(--bg); }
  @media (hover: none) { td.del button, td.grip span { visibility: visible; } }
  .up { color: var(--up); } .down { color: var(--down); } .dim { color: var(--muted); }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .tag { font-size: calc(var(--fs) * .8); color: var(--muted); border: 1px solid var(--line); border-radius: 3px;
         padding: 0 3px; margin-right: 4px; font-weight: 400; }
  .rsi { display: inline-flex; align-items: center; gap: 6px; }
  .gauge { position: relative; width: 56px; height: 5px; border-radius: 3px; }
  .gauge i { position: absolute; top: -3px; width: 3px; height: 11px; border-radius: 2px; background: var(--text);
             box-shadow: 0 0 0 1px var(--panel); }
  .trend { display: inline-block; width: calc(var(--fs) * 1); text-align: center; font-size: calc(var(--fs) * 0.9); }
  .hot { color: var(--hot); } .cold { color: var(--cold); }
  .hot.strong, .cold.strong { font-weight: 800; text-decoration: underline; text-underline-offset: 2px; }
  .hbtn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
          border-radius: 99px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
  .hbtn.off { color: var(--muted); }
  .fsz { display: inline-flex; }
  .fsz .hbtn:first-child { border-radius: 99px 0 0 99px; border-right: 0; }
  .fsz .hbtn:last-child { border-radius: 0 99px 99px 0; }
  .hbtn:disabled { opacity: .4; cursor: default; }
  .hbtn:hover { background: var(--sel); }
  #events { list-style: none; margin: 0; padding: 3px 0; max-height: calc(3 * var(--fs) * 1.8 + 6px); overflow-y: auto; }
  #events li { height: calc(var(--fs) * 1.8); align-items: center; }
  #events li { display: flex; gap: 8px; padding: 2px 10px; white-space: nowrap; }
  #events li .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  #events li.sup { color: var(--muted); }
  #events li.empty { color: var(--muted); }
  .evhead { display: flex; gap: 10px; align-items: center; padding: 6px 10px 0; color: var(--muted); font-weight: 600; }
  .evhead label { font-weight: 400; display: inline-flex; gap: 3px; align-items: center; cursor: pointer; }
  .evhead input { margin: 0; }
  td.last { color: var(--muted); }
  td.last b { font-weight: 600; }
  .charthead { display: flex; align-items: baseline; gap: 8px; padding: 8px 10px 2px; }
  .charthead h2 { margin: 0; font-size: calc(var(--fs) * 1.1); }
  .pane { position: relative; }
  .pane span { position: absolute; left: 8px; top: 4px; z-index: 2; font-size: calc(var(--fs) * 0.9); color: var(--muted); }
  #c-price { height: 260px; } #c-rsi { height: 110px; } #c-macd { height: 130px; }
  @media (max-width: 600px) {
    #c-price { height: 200px; } #c-rsi { height: 90px; } #c-macd { height: 100px; }
    .gauge { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1><small class="by">한량이 만든</small> 한국투자증권 RSI Monitor ver 0.1</h1>
  <span style="margin-left:auto"></span>
  <span class="fsz"><button class="hbtn" id="fsdown" title="글자 작게" aria-label="글자 작게">가-</button><button class="hbtn" id="fsup" title="글자 크게" aria-label="글자 크게">가+</button></span>
  <button class="hbtn" id="setbtn" title="소리 설정" aria-expanded="false">⚙ 설정</button>
  <span class="pill" id="status">연결 중</span>
</header>
<div class="menu" id="setmenu" hidden>
  <div class="mrow"><span>지표</span><span class="sub" id="sub"></span></div>
  <div class="mrow"><span>알림 소리</span><button class="hbtn" id="sound" title="알림 소리 켜고 끄기"></button></div>
  <div class="mrow"><span>시그널 소리</span><button class="hbtn" id="sigsound" title="매수·매도 시그널도 말로 알릴지"></button></div>
  <div class="mrow"><span>목소리</span><button class="hbtn" id="soundtest" title="고른 종목의 65 초과 문장을 한 번 읽는다">TTS 테스트</button></div>
</div>
<div id="markets"></div>
<main>
  <div class="card">
    <form class="add" id="add">
      <input id="ticker" placeholder="TSLA · NYS:BE · 005930" autocomplete="off" spellcheck="false">
      <button id="addbtn">추가</button>
      <span id="msg" class="sub">미국은 티커, 국내는 종목코드 여섯 자리</span>
      <button type="button" id="colbtn" title="표에 보일 칸 고르기" aria-expanded="false">칸 ▾</button>
    </form>
    <div class="menu" id="colmenu" hidden></div>
    <style id="colstyle"></style>
    <div class="scroll">
      <table>
        <thead><tr><th></th><th>종목</th><th>가격</th><th>등락</th><th>RSI</th><th>구간</th><th>MACD</th><th>시그널</th><th>히스토</th><th>매수/매도</th><th>최근 알림</th><th>현지시각</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <div class="evhead">알림 기록 <label><input type="checkbox" id="evsel"> 고른 종목만</label></div>
    <ul id="events"><li class="empty">아직 없다</li></ul>
  </div>
  <div class="card">
    <div class="charthead"><h2 id="ctitle"></h2><span class="sub">시각은 그 시장의 현지 시각</span></div>
    <div class="pane" id="c-price"></div>
    <div class="pane" id="c-rsi"><span>RSI</span></div>
    <div class="pane" id="c-macd"><span>MACD · 시그널 · 히스토그램</span></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let cfg = {}, selected = null, rows = {}, charts = null, events = [];
const TREND_EPS = 0.05;  // 텍스트 버전과 같다

const f = (v, d = 2) => v == null ? "-" : v.toFixed(d);
const sgn = (v, d = 4) => v == null ? "-" : (v >= 0 ? "+" : "") + v.toFixed(d);
const fmtPrice = (p, krx) => p == null ? "-" : krx ? p.toLocaleString("ko-KR") : p.toFixed(p >= 100 ? 2 : 4);
const hms = t => t ? `${t.slice(0,2)}:${t.slice(2,4)}:${t.slice(4,6)}` : "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function setStatus(s) {
  const el = $("#status");
  el.textContent = s; el.title = s;
  el.className = "pill " + (s === "실시간" ? "ok" : /끊김|이미/.test(s) ? "bad" : "");
}

function setMsg(s, err) {
  $("#msg").textContent = s;
  $("#msg").className = "sub" + (err ? " err" : "");
}

// 막대 칠: 30 아래 진한 파랑, 30~35 옅은 파랑, 35~65 회색(밴드 안), 65~70 옅은 빨강, 70 위 진한 빨강
let _gauge = "";
function gaugeBg() {
  if (_gauge) return _gauge;
  const cold = css("--cold"), hot = css("--hot"), mid = css("--line");
  const soft = c => `color-mix(in srgb, ${c} 45%, ${mid})`;
  const a = cfg.strong_lower, b = cfg.lower, c = cfg.upper, d = cfg.strong_upper;
  return _gauge = `linear-gradient(to right, ${cold} 0 ${a}%, ${soft(cold)} ${a}% ${b}%, ${mid} ${b}% ${c}%, ` +
                  `${soft(hot)} ${c}% ${d}%, ${hot} ${d}% 100%)`;
}

function rsiCell(r) {
  if (r.rsi == null) return "-";
  const v = r.rsi;
  const cls = v < cfg.strong_lower ? "cold strong" : v < cfg.lower ? "cold"
            : v > cfg.strong_upper ? "hot strong" : v > cfg.upper ? "hot" : "";
  let trend = '<span class="trend dim">—</span>';
  if (r.rsi_prev != null) {
    const d = v - r.rsi_prev;
    if (d > TREND_EPS) trend = '<span class="trend up">▲</span>';
    else if (d < -TREND_EPS) trend = '<span class="trend down">▼</span>';
  }
  return `<span class="rsi"><span class="gauge" style="background:${gaugeBg()}">` +
         `<i style="left:calc(${Math.max(0, Math.min(100, v))}% - 1.5px)"></i></span>` +
         `<span class="${cls}">${f(v)}</span>${trend}</span>`;
}

function ago(ts) {
  const m = Math.floor((Date.now() / 1000 - ts) / 60);
  if (m < 1) return "방금";
  if (m < 60) return `${m}분`;
  if (m < 60 * 24) return `${Math.floor(m / 60)}시간`;
  return `${Math.floor(m / 1440)}일`;
}

function zoneCell(r) {
  const [zone, strength] = r.zone || ["neutral", ""];
  if (zone === "neutral") return `<span class="dim">밴드 안${r.rearm ? " · 재무장 대기" : ""}</span>`;
  const edge = zone === "above" ? (strength === "strong" ? cfg.strong_upper : cfg.upper)
                                : (strength === "strong" ? cfg.strong_lower : cfg.lower);
  const cls = (zone === "above" ? "hot" : "cold") + (strength === "strong" ? " strong" : "");
  return `<span class="${cls}">${edge} ${zone === "above" ? "초과" : "미만"}</span>`;
}

function lastCell(r) {
  const a = r.last_alert;
  if (!a) return "";
  return `<b class="${a.zone === "above" ? "up" : "down"}">${esc(a.text.replace(" (시작 때부터)", ""))}</b> ${ago(a.ts)}`;
}

function sigCell(r) {
  const x = r.last_signal;
  if (!x) return "";
  const t = new Date(x.bar * 1000).toISOString().slice(11, 16);   // 봉 시각(현지)
  return `<b class="${x.side === "buy" ? "up" : "down"}${x.grade === "강" ? " strong" : ""}">${x.word} ${x.grade}</b> ` +
         `<span class="dim" title="${esc(x.trend)}">${t}</span>`;
}

function cells(r) {
  const krx = r.excd === "KRX";
  const d = krx ? 1 : 4;
  return [
    krx ? esc(r.name) : r.symb,
    (r.day ? '<span class="tag" title="미국 주간거래(한국 낮) 체결가. 차트·RSI 는 애프터장 봉까지다">주간</span>' : "") +
      fmtPrice(r.price, krx),
    r.rate == null ? "" : `<span class="${r.rate >= 0 ? "up" : "down"}">${sgn(r.rate, 2)}%</span>`,
    rsiCell(r),
    zoneCell(r),
    sgn(r.macd, d), sgn(r.signal, d),
    `<span class="${r.hist >= 0 ? "pos" : "neg"}">${sgn(r.hist, d)}</span>`,
    sigCell(r),
    lastCell(r),
    hms(r.time),
  ];
}

const GRIP = '<span aria-hidden="true">⋮⋮</span>';

const TRASH = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/>' +
  '<path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>' +
  '<path d="M10 11v6M14 11v6"/></svg>';

function renderRow(r) {
  let tr = document.getElementById("r-" + r.symb);
  const c = cells(r);
  if (!tr) {
    tr = document.createElement("tr");
    tr.id = "r-" + r.symb;
    tr.title = r.excd === "KRX" ? `${r.name} · ${r.symb}` : `${r.excd}:${r.symb}`;
    tr.innerHTML = `<td class="grip" title="끌어서 차례 바꾸기">${GRIP}</td>` + c.map((x, i) => `<td class="${i === 0 ? "sym" : i === 9 ? "last" : ""}">${x}</td>`).join("") +
                   `<td class="del"><button title="빼기" aria-label="종목 빼기">${TRASH}</button></td>`;
    tr.onclick = () => select(r.symb);
    dragRow(tr, tr.querySelector(".grip"));
    tr.querySelector(".del button").onclick = e => { e.stopPropagation(); removeTicker(r.symb); };
    $("#rows").appendChild(tr);
    if (r.symb === selected) tr.classList.add("sel");
  } else {
    c.forEach((x, i) => { const td = tr.children[i + 1]; if (td.innerHTML !== x) td.innerHTML = x; });
  }
  rows[r.symb] = r;
}

// 손잡이(⋮⋮)를 끌어 줄 차례를 바꾼다. 마우스와 손가락 모두 되게 pointer 이벤트로 한다.
// 줄을 옮기면 pointer capture 가 풀리므로 움직임은 window 에서 받는다
function dragRow(tr, grip) {
  grip.onclick = e => e.stopPropagation();
  grip.onpointerdown = e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const before = order().join();
    tr.classList.add("dragging");
    $("#rows").classList.add("sorting");
    const move = e => {
      const others = [...$("#rows").children].filter(x => x !== tr);
      const next = others.find(x => { const b = x.getBoundingClientRect(); return e.clientY < b.top + b.height / 2; });
      if (next !== tr.nextElementSibling) $("#rows").insertBefore(tr, next || null);
    };
    const up = async () => {
      removeEventListener("pointermove", move);
      removeEventListener("pointerup", up);
      removeEventListener("pointercancel", up);
      tr.classList.remove("dragging");
      $("#rows").classList.remove("sorting");
      if (order().join() === before) return;
      const res = await fetch("/api/order", { method: "PUT", headers: { "Content-Type": "application/json" },
                                              body: JSON.stringify({ symbs: order() }) }).catch(() => null);
      if (!res || !res.ok) { setMsg("차례를 저장하지 못했다", true); loadState(); }
    };
    addEventListener("pointermove", move);
    addEventListener("pointerup", up);
    addEventListener("pointercancel", up);
  };
}

const order = () => [...$("#rows").children].map(tr => tr.id.slice(2));

function applyOrder(symbs) {
  symbs.forEach(s => { const tr = document.getElementById("r-" + s); if (tr) $("#rows").appendChild(tr); });
}

function dropRow(symb) {
  document.getElementById("r-" + symb)?.remove();
  delete rows[symb];
  if (selected === symb) {
    const first = $("#rows tr")?.id.slice(2);
    if (first) select(first); else clearChart();
  }
}

function makeCharts() {
  const base = {
    layout: { background: { color: "transparent" }, textColor: css("--muted"), fontSize: fontSize },
    grid: { vertLines: { color: css("--line") }, horzLines: { color: css("--line") } },
    rightPriceScale: { borderColor: css("--line"), minimumWidth: 70 },
    timeScale: { borderColor: css("--line"), timeVisible: true, secondsVisible: false },
    crosshair: { mode: 0 },
    autoSize: true,
  };
  const price = LightweightCharts.createChart($("#c-price"), base);
  const rsi = LightweightCharts.createChart($("#c-rsi"), base);
  const macd = LightweightCharts.createChart($("#c-macd"), base);
  const s = {
    candle: price.addCandlestickSeries({ upColor: css("--up"), downColor: css("--down"),
      borderVisible: false, wickUpColor: css("--up"), wickDownColor: css("--down") }),
    rsi: rsi.addLineSeries({ color: css("--text"), lineWidth: 2, priceLineVisible: false }),
    hist: macd.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false }),
    macd: macd.addLineSeries({ color: css("--down"), lineWidth: 2, priceLineVisible: false }),
    signal: macd.addLineSeries({ color: "#e69a28", lineWidth: 2, priceLineVisible: false }),
  };
  s.rsi.createPriceLine({ price: cfg.upper, color: css("--hot"), lineStyle: 2, lineWidth: 1, axisLabelVisible: false });
  s.rsi.createPriceLine({ price: cfg.lower, color: css("--cold"), lineStyle: 2, lineWidth: 1, axisLabelVisible: false });
  s.rsi.createPriceLine({ price: cfg.strong_upper, color: css("--hot"), lineStyle: 1, lineWidth: 1, axisLabelVisible: false });
  s.rsi.createPriceLine({ price: cfg.strong_lower, color: css("--cold"), lineStyle: 1, lineWidth: 1, axisLabelVisible: false });
  rsi.priceScale("right").applyOptions({ scaleMargins: { top: 0.06, bottom: 0.06 } });
  s.rsi.applyOptions({ autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }) });
  price.timeScale().applyOptions({ visible: false });
  rsi.timeScale().applyOptions({ visible: false });
  const all = [price, rsi, macd];
  all.forEach(a => a.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (!r) return;
    all.forEach(b => b !== a && b.timeScale().setVisibleLogicalRange(r));
  }));
  return { all, s };
}

const histPt = p => p.value == null ? p : ({ time: p.time, value: p.value, color: p.value >= 0 ? css("--pos") : css("--neg") });

function clearChart() {
  selected = null;
  $("#ctitle").textContent = "종목을 더하면 차트가 나온다";
  if (charts) Object.values(charts.s).forEach(x => x.setData([]));
}

async function select(symb) {
  if (!symb) return clearChart();
  selected = symb;
  document.querySelectorAll("tbody tr").forEach(tr => tr.classList.toggle("sel", tr.id === "r-" + symb));
  const r = rows[symb];
  $("#ctitle").textContent = `${r && r.excd === "KRX" ? r.name : symb} · ${cfg.nmin}분봉`;
  const res = await fetch("/api/chart/" + symb);
  if (!res.ok || selected !== symb) return;
  const d = await res.json();
  if (!charts) charts = makeCharts();
  const s = charts.s;
  const krx = r && r.excd === "KRX";
  s.candle.applyOptions({ priceFormat: krx ? { type: "price", precision: 0, minMove: 1 }
                                           : { type: "price", precision: 2, minMove: 0.01 } });
  s.candle.setData(d.bars);
  barTimes = new Set(d.bars.map(b => b.time));
  chartSignals = d.signals || [];
  setMarkers();
  if (onlySel()) renderEvents();
  s.rsi.setData(d.rsi);
  s.macd.setData(d.macd);
  s.signal.setData(d.signal);
  s.hist.setData(d.hist.map(histPt));
  charts.all[0].timeScale().setVisibleLogicalRange({ from: d.bars.length - 80, to: d.bars.length + 2 });
  try { localStorage.setItem("sel", symb); } catch (e) {}
}

function pushChart(r) {
  if (!charts || r.symb !== selected || !r.bar) return;
  const t = r.bar.time, s = charts.s;
  barTimes.add(t);
  s.candle.update(r.bar);
  if (r.rsi != null) s.rsi.update({ time: t, value: r.rsi });
  s.macd.update({ time: t, value: r.macd });
  s.signal.update({ time: t, value: r.signal });
  s.hist.update(histPt({ time: t, value: r.hist }));
}

$("#add").onsubmit = async e => {
  e.preventDefault();
  const t = $("#ticker").value.trim();
  if (!t) return;
  $("#addbtn").disabled = true;
  setMsg(`${t} 찾는 중…`);
  try {
    const res = await fetch("/api/tickers", { method: "POST", headers: { "Content-Type": "application/json" },
                                              body: JSON.stringify({ ticker: t }) });
    const j = await res.json();
    if (!res.ok) throw new Error(j.detail || res.statusText);
    $("#ticker").value = "";
    setMsg(`${j.symb} 더했다`);
    select(j.symb);
  } catch (err) {
    setMsg(err.message, true);
  } finally {
    $("#addbtn").disabled = false;
    $("#ticker").focus();
  }
};

async function removeTicker(symb) {
  const res = await fetch("/api/tickers/" + encodeURIComponent(symb), { method: "DELETE" });
  if (res.ok) { dropRow(symb); setMsg(`${symb} 뺐다`); }
  else setMsg(`${symb} 빼지 못했다`, true);
}

function eventItem(ev) {
  const li = document.createElement("li");
  const n = new Date(), today = `${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
  const cls = ev.zone === "above" ? "up" : "down";
  li.className = ev.suppressed ? "sup" : "";
  li.innerHTML = `<span class="t">${ev.d && ev.d !== today ? ev.d + " " : ""}${ev.t}</span><b>${esc(ev.name)}</b>` +
    `<span class="${ev.suppressed ? "" : cls}">${esc(ev.text)}${ev.strength === "strong" ? " ‼" : ""}</span>` +
    `<span class="dim">RSI ${f(ev.rsi)}</span>` +
    (ev.detail ? `<span class="dim">${esc(ev.detail)}</span>` : "") +
    (ev.suppressed ? `<span class="dim">억제 — ${esc(ev.suppressed)}</span>` : "");
  return li;
}

const onlySel = () => $("#evsel").checked;

function renderEvents() {
  const ul = $("#events");
  ul.innerHTML = "";
  const list = events.filter(ev => !onlySel() || ev.symb === selected).slice(0, 200);
  if (!list.length) { ul.innerHTML = '<li class="empty">아직 없다</li>'; return; }
  list.forEach(ev => ul.appendChild(eventItem(ev)));
}

function addEvent(ev) {
  events.unshift(ev);
  if (events.length > 500) events.pop();
  renderEvents();
  if (ev.symb === selected) {
    if (ev.type === "signal") chartSignals.push({ time: ev.bar, side: ev.side, word: ev.side === "buy" ? "매수" : "매도",
                                                  grade: ev.strength === "strong" ? "강" : "약" });
    setMarkers();
  }
}

$("#evsel").onchange = () => {
  try { localStorage.setItem("evsel", onlySel() ? "1" : ""); } catch (e) {}
  renderEvents();
};
try { $("#evsel").checked = !!localStorage.getItem("evsel"); } catch (e) {}

// 차트에 알림이 난 봉을 표시한다. 초과는 봉 위 ▼, 미만은 봉 아래 ▲ (울린 것만)
let barTimes = new Set(), chartSignals = [];
function setMarkers() {
  if (!charts) return;
  const band = events.filter(ev => ev.symb === selected && !ev.suppressed && ev.type !== "signal" && barTimes.has(ev.bar))
    .map(ev => ({ time: ev.bar, position: ev.zone === "above" ? "aboveBar" : "belowBar",
                  color: ev.zone === "above" ? css("--hot") : css("--cold"),
                  shape: "circle", size: 0.6, text: ev.text.split(" ")[0] }));
  const sig = chartSignals.filter(x => barTimes.has(x.time))
    .map(x => ({ time: x.time, position: x.side === "buy" ? "belowBar" : "aboveBar",
                 color: x.side === "buy" ? css("--up") : css("--down"),
                 shape: x.side === "buy" ? "arrowUp" : "arrowDown",
                 text: `${x.word}${x.grade === "강" ? "!" : ""}` }));
  charts.s.candle.setMarkers([...band, ...sig].sort((a, b) => a.time - b.time));
}

function renderMarkets(list) {
  $("#markets").innerHTML = (list || []).map(m => {
    if (m.price == null) return `<span class="m"><span class="n">${esc(m.name)}</span><span class="dim">-</span></span>`;
    const digits = m.kind === "BTC" ? 0 : 2;
    const v = m.price.toLocaleString("ko-KR", { minimumFractionDigits: digits, maximumFractionDigits: digits });
    const cls = m.rate > 0 ? "up" : m.rate < 0 ? "down" : "dim";
    return `<span class="m"><span class="n">${esc(m.name)}</span><span class="v">${v}</span>` +
           `<span class="${cls}">${sgn(m.rate, 2)}%</span></span>`;
  }).join("");
}

function setSound(on) {
  cfg.sound = on;
  $("#sound").textContent = on ? "🔊 켜짐" : "🔇 꺼짐";
  $("#sound").classList.toggle("off", !on);
  // 설정 안에 숨어 있어도 소리가 꺼진 줄은 알 수 있게
  $("#setbtn").textContent = on ? "⚙ 설정" : "⚙ 설정 🔇";
  $("#setbtn").title = on ? "소리 설정" : "소리 설정 — 알림 소리가 꺼져 있다";
}

function setSigSound(on) {
  cfg.signal_sound = on;
  $("#sigsound").textContent = on ? "🔊 켜짐" : "🔇 꺼짐";
  $("#sigsound").classList.toggle("off", !on);
}

$("#sigsound").onclick = async () => {
  const res = await fetch("/api/signal-sound", { method: "POST", headers: { "Content-Type": "application/json" },
                                                 body: JSON.stringify({ on: !cfg.signal_sound }) });
  if (res.ok) setSigSound((await res.json()).signal_sound);
};

$("#sound").onclick = async () => {
  const res = await fetch("/api/sound", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ on: !cfg.sound }) });
  if (res.ok) setSound((await res.json()).sound);
};

$("#soundtest").onclick = async () => {
  const res = await fetch("/api/sound/test", { method: "POST", headers: { "Content-Type": "application/json" },
                                               body: JSON.stringify({ symb: selected || "" }) });
  const j = await res.json();
  setMsg(`시험: "${j.text}" — ` + (j.cached ? "만들어 둔 소리" : j.engine === "local" ? "로컬 TTS 로 만드는 중"
                 : j.engine === "edge" ? "Edge 음성으로 만드는 중" : "윈도우 음성"));
};

// 표에 보일 칸을 고른다. 고른 것은 이 브라우저에만 기억한다 (PC 와 휴대폰을 따로 맞출 수 있게)
// 손잡이·종목·휴지통 칸은 늘 보인다
const COLS = [...document.querySelectorAll("thead th")].map((th, i) => ({ n: i + 1, name: th.textContent }))
  .filter(c => c.name && c.name !== "종목");
let hiddenCols = new Set();
try { hiddenCols = new Set(JSON.parse(localStorage.getItem("hidecols") || "[]")); } catch (e) {}

function applyCols() {
  $("#colstyle").textContent = COLS.filter(c => hiddenCols.has(c.name))
    .map(c => `table th:nth-child(${c.n}), table td:nth-child(${c.n}) { display: none; }`).join(" ");
  $("#colbtn").textContent = hiddenCols.size ? `칸 ${COLS.length - hiddenCols.size}/${COLS.length} ▾` : "칸 ▾";
}

$("#colmenu").innerHTML = COLS.map(c =>
  `<label><input type="checkbox" value="${esc(c.name)}">${esc(c.name)}</label>`).join("");
$("#colmenu").onchange = e => {
  e.target.checked ? hiddenCols.delete(e.target.value) : hiddenCols.add(e.target.value);
  try { localStorage.setItem("hidecols", JSON.stringify([...hiddenCols])); } catch (e) {}
  applyCols();
};

applyCols();

// 버튼 아래에 펼쳐지는 메뉴 (칸 고르기, 설정). 바깥을 누르거나 Esc·스크롤이면 닫는다
const menus = [];
function popMenu(btn, menu, onOpen) {
  const show = open => {
    menu.hidden = !open;
    btn.setAttribute("aria-expanded", open);
    if (!open) return;
    onOpen?.();
    const b = btn.getBoundingClientRect();
    menu.style.top = `${b.bottom + 4}px`;
    menu.style.left = `${Math.max(8, Math.min(b.right - menu.offsetWidth, innerWidth - menu.offsetWidth - 8))}px`;
  };
  btn.onclick = e => {
    e.stopPropagation();
    const open = menu.hidden;
    menus.forEach(m => m(false));
    show(open);
  };
  menus.push(show);
  document.addEventListener("click", e => { if (!menu.contains(e.target)) show(false); });
}
popMenu($("#colbtn"), $("#colmenu"),
        () => $("#colmenu").querySelectorAll("input").forEach(x => x.checked = !hiddenCols.has(x.value)));
popMenu($("#setbtn"), $("#setmenu"));
document.addEventListener("keydown", e => { if (e.key === "Escape") menus.forEach(m => m(false)); });
addEventListener("scroll", e => { if (!e.target.closest?.(".menu")) menus.forEach(m => m(false)); }, true);
addEventListener("resize", () => menus.forEach(m => m(false)));

// 글자 크기. 이 브라우저에만 기억한다
const FS_MIN = 9, FS_MAX = 18;
let fontSize = 10;
try { fontSize = Math.min(FS_MAX, Math.max(FS_MIN, +localStorage.getItem("fs") || 10)); } catch (e) {}

function setFontSize(n) {
  fontSize = Math.min(FS_MAX, Math.max(FS_MIN, n));
  document.documentElement.style.setProperty("--fs", fontSize + "px");
  $("#fsdown").disabled = fontSize <= FS_MIN;
  $("#fsup").disabled = fontSize >= FS_MAX;
  $("#fsdown").title = `글자 작게 · 지금 ${fontSize}px`;
  $("#fsup").title = `글자 크게 · 지금 ${fontSize}px`;
  if (charts) charts.all.forEach(c => c.applyOptions({ layout: { fontSize } }));
  try { localStorage.setItem("fs", fontSize); } catch (e) {}
}
$("#fsdown").onclick = () => setFontSize(fontSize - 1);
$("#fsup").onclick = () => setFontSize(fontSize + 1);
setFontSize(fontSize);

async function loadState() {
  const st = await (await fetch("/api/state")).json();
  cfg = st;
  $("#sub").textContent = `${st.nmin}분봉 · RSI(${st.period}) · MACD(12,26,9)`;
  setStatus(st.status);
  setSound(st.sound);
  setSigSound(st.signal_sound);
  renderMarkets(st.markets);
  events = st.events || [];
  renderEvents();
  $("#rows").innerHTML = ""; rows = {};
  st.rows.forEach(renderRow);
  let want = selected;
  if (!want) try { want = localStorage.getItem("sel"); } catch (e) {}
  select(rows[want] ? want : st.rows[0]?.symb);
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "rows") m.rows.forEach(r => { if (rows[r.symb]) { renderRow(r); pushChart(r); } });
    else if (m.type === "add") renderRow(m.row);
    else if (m.type === "remove") dropRow(m.symb);
    else if (m.type === "order") { if (!$("#rows .dragging")) applyOrder(m.symbs); }
    else if (m.type === "status") setStatus(m.status);
    else if (m.type === "alert") addEvent(m.event);
    else if (m.type === "markets") renderMarkets(m.markets);
    else if (m.type === "reload") loadState();
  };
  ws.onclose = () => { setStatus("서버와 끊김 — 다시 붙는 중"); setTimeout(() => { loadState().catch(() => {}); connect(); }, 3000); };
}

// "11분 전" 같은 글자를 30초마다 새로 쓴다
setInterval(() => Object.values(rows).forEach(renderRow), 30000);

loadState().then(connect);
</script>
